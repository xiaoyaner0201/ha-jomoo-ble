[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-jomoo-ble"
version = "0.3.0"
description = "Clean-room JOMOO ZS800J Bluetooth protocol library and Home Assistant integration"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/xiaoyaner0201/ha-jomoo-ble"

[tool.setuptools.packages.find]
include = ["jomoo_ble*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
