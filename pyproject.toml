[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-jomoo-ble"
version = "0.1.0"
description = "Conservative clean-room JOMOO ZS800J BLE protocol and HA custom integration"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["jomoo_ble*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
